name: Build setup
description: >-
  Everything a Gradle job here needs before it runs - the JDK, the Android SDK packages, Gradle with its
  caches - and, when asked, ffmpeg (for the app's sound effects). Shared by the workflows' Gradle jobs;
  runs after actions/checkout.

inputs:
  ffmpeg:
    description: "Install ffmpeg - scripts/normalize-audio.sh needs it for app:android's resources"
    default: "false"
  cache-writer:
    description: "Save Gradle's cache at the job's end - only for a job that runs resolveDependencies (see 'Name the Gradle cache')"
    default: "false"

runs:
  using: composite
  steps:
    # The Java version is owned by the Gradle toolchain (gradle/gradle-daemon-jvm.properties), which
    # Gradle would download itself; installing the same JDK here just saves it that download. Read
    # at run time rather than pinned here, so a JDK move never has to edit this file.
    - name: Read the Java version from the Gradle toolchain
      id: java
      shell: bash
      run: echo "version=$(sed -n 's/^toolchainVersion=\([0-9]*\).*/\1/p' gradle/gradle-daemon-jvm.properties)" >> "$GITHUB_OUTPUT"

    - name: Set up JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: ${{ steps.java.outputs.version }}

    # ubuntu-latest runners ship a full Android SDK pre-installed (cmdline-tools, licenses already
    # accepted) - just install the specific packages this project builds against, which
    # android_sdk_packages.sh reads from gradle/android-sdk.properties (not pinned here, for the same
    # reason as the JDK above). (android-actions/setup-android@v3 was tried here but fails on current
    # runners: it also tries to install the long-removed legacy "tools" package.)
    - name: Install required Android SDK packages
      shell: bash
      run: |
        ANDROID_CLI="$ANDROID_HOME/cmdline-tools/latest/bin/android"
        read -ra packages <<< "$(.github/scripts/android_sdk_packages.sh)"
        if [ -x "$ANDROID_CLI" ]; then
          "$ANDROID_CLI" sdk install --sdk="$ANDROID_HOME" "${packages[@]}"
        else
          # The runner's cmdline-tools predate the android CLI, so sdkmanager is the only installer.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes always exits non-zero here (sdkmanager stops reading, so yes hits a broken pipe), which
          # `shell: bash`'s pipefail would take as the step failing; only sdkmanager's own status counts.
          { yes 2>/dev/null || true; } | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "${packages[@]}"
        fi

    # ffmpeg's packages (~66 MB) are cached: Ubuntu's mirrors served them in ten seconds to some jobs and in ten to
    # sixteen minutes to others of the same release run. Keyed on the runner image, whose package lists pick the
    # versions; a new image restores the last image's packages, and apt downloads only the ones that changed. The
    # runner's own environment isn't in the `env` context, so the key is read in a step.
    - name: Name the ffmpeg packages' cache
      id: ffmpeg-cache-key
      if: inputs.ffmpeg == 'true'
      shell: bash
      run: |
        echo "dir=$HOME/ffmpeg-debs" >> "$GITHUB_OUTPUT"
        echo "prefix=ffmpeg-debs-${ImageOS:-unknown}-" >> "$GITHUB_OUTPUT"
        echo "key=ffmpeg-debs-${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Restore the ffmpeg packages
      if: inputs.ffmpeg == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.ffmpeg-cache-key.outputs.dir }}
        key: ${{ steps.ffmpeg-cache-key.outputs.key }}
        restore-keys: ${{ steps.ffmpeg-cache-key.outputs.prefix }}

    # scripts/normalize-audio.sh shells out to ffmpeg to peak-normalise the clips in app/audio/ (for
    # Android's normalizeOggAudio task), and ubuntu-latest runners don't ship it. apt keeps its downloads in the
    # cached directory, using any package already there. The runner's own package lists are tried first, and only
    # refreshed if they can't find it.
    - name: Install ffmpeg
      if: inputs.ffmpeg == 'true'
      shell: bash
      env:
        DEBS: ${{ steps.ffmpeg-cache-key.outputs.dir }}
      run: |
        mkdir -p "$DEBS"
        # As apt's own archives/partial is, so its downloads stay sandboxed as _apt.
        sudo install -d -o _apt -g root -m 700 "$DEBS/partial"
        install() { sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$DEBS" ffmpeg; }
        install || {
          sudo apt-get update
          install
        }
        # Readable by the cache's save, which runs as the runner's user.
        sudo chmod -R a+rX "$DEBS"

    # One Gradle cache for every job, written by one job alone. setup-gradle keys its entry on the job, and a job restores
    # its own job's last entry first, so by default each job kept its own copy of the dependencies (hundreds of MB each,
    # which pushed the repo past GitHub's 10 GB and had entries evicted), and after a version bump each job downloaded the
    # new ones from Maven Central at once (which answered 429 Too Many Requests). Every job now has the same name in the
    # key, set for the whole job so the post step saves under it too, and only a job passing cache-writer saves: one that
    # has run `./gradlew resolveDependencies` first (android-release.yml's dependencies job, and update-dependencies.yml's
    # update job after a bump). The rest restore the newest entry, whichever writer saved it.
    - name: Name the Gradle cache
      shell: bash
      run: echo "GRADLE_BUILD_ACTION_CACHE_KEY_JOB=gradle" >> "$GITHUB_ENV"

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.cache-writer != 'true' }}
